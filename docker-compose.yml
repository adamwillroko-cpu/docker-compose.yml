cat << EOF > docker-compose.yml
services:
  ghost:
    image: ghost:5-alpine
    container_name: ghost_app
    restart: always
    ports:
      - "2368:2368"
    volumes:
      # Isse aapka data, images aur templates hamesha safe rahenge
      - ghost_content:/var/lib/ghost/content
    environment:
      url: https://${CODESPACE_NAME}-2368.app.github.dev
      # Full Gmail SMTP Configuration
      mail__transport: SMTP
      mail__options__host: smtp.gmail.com
      mail__options__port: 587
      mail__options__secureConnection: "false"
      mail__options__auth__user: YOUR_GMAIL_HERE@gmail.com
      mail__options__auth__pass: YOUR_16_DIGIT_APP_PASSWORD_HERE
      mail__from: YOUR_GMAIL_HERE@gmail.com

volumes:
  ghost_content:
EOF
